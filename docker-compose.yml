services:
  db:
    image: mysql:8.4
    container_name: restaurant-db
    restart: unless-stopped
    init: true
    environment:
      MYSQL_DATABASE: restaurantdb
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1g
    networks:
      - restaurant-net

  app:
    image: restaurant:1.1.0
    build: .
    container_name: restaurant-app
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/restaurantdb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 768m
    networks:
      - restaurant-net

volumes:
  db-data:

networks:
  restaurant-net:
    driver: bridge