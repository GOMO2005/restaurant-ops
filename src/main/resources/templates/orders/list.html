<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Orders - Restaurant Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <div class="card">
        <h1>Active Orders</h1>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <table>
            <thead>
            <tr><th>Order</th><th>Table</th><th>Waiter</th><th>Status</th><th>Items</th><th>Total</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td th:text="'#' + ${o.id}">#1</td>
                <td th:text="'T' + ${o.table.tableNumber}">T1</td>
                <td th:text="${o.takenBy.fullName}">Waiter</td>
                <td><span class="badge info" th:text="${o.status}">PLACED</span></td>
                <td th:text="${#lists.size(o.items)}">2</td>
                <td th:text="${o.total}">0.00</td>
                <td><a class="btn" th:href="@{/orders/{id}(id=${o.id})}">Open</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(orders)}">
                <td colspan="7">No active orders. <a th:href="@{/orders/new}">Create one</a></td>
            </tr>
            </tbody>
        </table>
        <p><a class="btn" th:href="@{/orders/new}">+ New Order</a></p>
    </div>
</div>
</body>
</html>
