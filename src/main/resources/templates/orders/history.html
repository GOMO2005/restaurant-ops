<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order History - Restaurant Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <div class="card">
        <h1>Order History (last 50 closed orders)</h1>
        <p>Revenue from paid orders shown: <strong th:text="${revenue}">0</strong></p>
        <table>
            <thead>
            <tr><th>Order</th><th>Table</th><th>Waiter</th><th>Status</th><th>Items</th><th>Total</th><th>Created</th></tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td th:text="'#' + ${o.id}">#1</td>
                <td th:text="'T' + ${o.table.tableNumber}">T1</td>
                <td th:text="${o.takenBy.fullName}">Waiter</td>
                <td>
                    <span class="badge ok" th:if="${o.status.name() == 'PAID'}">PAID</span>
                    <span class="badge no" th:if="${o.status.name() == 'CANCELLED'}">CANCELLED</span>
                </td>
                <td th:text="${#lists.size(o.items)}">2</td>
                <td th:text="${o.total}">0.00</td>
                <td th:text="${#temporals.format(o.createdAt, 'dd-MMM yyyy HH:mm')}">date</td>
            </tr>
            <tr th:if="${#lists.isEmpty(orders)}">
                <td colspan="7">No closed orders yet.</td>
            </tr>
            </tbody>
        </table>
        <p><a class="btn" th:href="@{/orders}">Back to Active Orders</a></p>
    </div>
</div>
</body>
</html>
