<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menu Item Form - Restaurant Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <div class="card">
        <h1 th:text="${item.id == null} ? 'New Menu Item' : 'Edit Menu Item'">Menu Item</h1>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <form th:action="@{/menu/save}" th:object="${item}" method="post">
            <input type="hidden" th:field="*{id}">
            <label>Name</label>
            <input type="text" th:field="*{name}" required>
            <label>Description</label>
            <textarea th:field="*{description}" rows="3"></textarea>
            <label>Price</label>
            <input type="number" step="0.01" min="0" th:field="*{price}" required>
            <label>Category</label>
            <select th:field="*{category}">
                <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
            </select>
            <label>
                <input type="checkbox" th:field="*{available}"> Available
            </label>
            <p>
                <button type="submit">Save</button>
                <a class="btn" th:href="@{/menu}">Cancel</a>
            </p>
        </form>
    </div>
</div>
</body>
</html>
